# macOS에서 WorkLogApp(SwiftUI/AppKit) 포함 전체 빌드와 Core 테스트를 실행한다.
# 개발 서버는 Linux라 macOS 전용 코드는 이 워크플로가 유일한 컴파일 검증 수단이다.
# Keychain·Touch ID·전역 단축키·실제 Codex 계정 연결은 CI에서도 검증하지 않는다(수동 확인 필요).
name: macOS build

on:
  push:
    branches: [main, "wlog-*/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build all targets (including WorkLogApp)
        run: swift build --build-tests
      - name: Test WorkLogCore
        run: swift test
