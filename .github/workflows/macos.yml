# macOS에서 WorkLogApp(SwiftUI/AppKit) 포함 전체 빌드와 Core 테스트를 실행한다.
# 개발 서버는 Linux라 macOS 전용 코드는 이 워크플로가 유일한 컴파일 검증 수단이다.
# Keychain·Touch ID·전역 단축키·실제 Codex 계정 연결은 CI에서도 검증하지 않는다(수동 확인 필요).
# PR·push 검증용 unsigned DMG 패키징까지 수행하지만 쓰기 권한·토큰은 주지 않는다.
name: macOS build

on:
  push:
    branches: [main, "wlog-*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build all targets (including WorkLogApp)
        run: swift build --build-tests
      - name: Test WorkLogCore
        run: swift test
      - name: Package unsigned DMG
        timeout-minutes: 15
        env:
          WORKLOG_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/build-dmg.sh
          bash distribution/verify-dmg.sh "release/WorkLog-$(cat VERSION)-arm64.dmg" "$(cat VERSION)"
          python3 distribution/release.py manifest "v$(cat VERSION)" release
          python3 distribution/release.py verify "v$(cat VERSION)" release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worklog-dmg-${{ github.sha }}
          path: |
            release/*.dmg
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 7
