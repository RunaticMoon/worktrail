# macOS에서 WorkLogApp(SwiftUI/AppKit) 포함 전체 빌드와 Core 테스트를 실행한다.
# 개발 서버는 Linux라 macOS 전용 코드는 이 워크플로가 유일한 컴파일 검증 수단이다.
# 실제 사용자 Keychain·Touch ID·전역 단축키·Codex 계정 연결은 수동 확인이 필요하다.
# 서명 연속성은 별도의 가짜 Keychain 항목과 새 테스트 인증서로 검증한다.
# PR·push 검증용 unsigned DMG 패키징까지 수행하지만 쓰기 권한·토큰은 주지 않는다.
name: macOS build

on:
  push:
    branches: [main, "wlog-*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: macOS and Xcode toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
      - name: Test release tooling
        timeout-minutes: 5
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 -m unittest discover -s distribution/tests -v
      - name: Build all targets (including WorkLogApp)
        run: swift build --build-tests
      - name: Test WorkLogCore
        run: swift test
      - name: Test OAuth callback, identity and recording recovery with fake data
        timeout-minutes: 3
        run: |
          bash scripts/maclab/run-chatgpt-identity-check.sh
          bash scripts/maclab/run-chatgpt-loopback-check.sh
          bash scripts/maclab/run-meeting-recording-recovery-check.sh
          bash scripts/maclab/run-meeting-termination-check.sh
      - name: Package unsigned DMG
        timeout-minutes: 15
        run: |
          scripts/build-dmg.sh
          bash distribution/verify-dmg.sh "release/WorkLog-$(cat VERSION)-arm64.dmg" "$(cat VERSION)"
          python3 distribution/release.py manifest "v$(cat VERSION)" release
          python3 distribution/release.py verify "v$(cat VERSION)" release
      - name: Verify a self-signed app loads bundled Sparkle
        timeout-minutes: 3
        env:
          WORKLOG_SIGNING_SMOKE_APP: .build/app/WorkLog.app
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 -m unittest discover -s distribution/tests -p test_code_signing.py -k MacOSPackagedAppSigningTests -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worklog-dmg-${{ github.sha }}
          path: |
            release/*.dmg
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 7
